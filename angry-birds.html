<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>愤怒的小鸟 · Angry Birds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #16202e;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }
  .stage {
    position: relative; width: 100%; max-width: 1280px;
    aspect-ratio: 16 / 9; max-height: 100vh;
    box-shadow: 0 24px 70px rgba(0,0,0,.6); overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: absolute; inset: 0; pointer-events: none;
    padding: 1.1% 1.8%;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .hud-left { display: flex; flex-direction: column; gap: .25em; }
  .score {
    font-size: clamp(22px, 3.4vw, 46px); font-weight: 900; color: #fff; line-height: 1;
    text-shadow: 0 3px 0 #1d3f5c, 0 0 2px #1d3f5c, 0 8px 18px rgba(0,0,0,.45);
    letter-spacing: 1.5px; font-variant-numeric: tabular-nums;
  }
  .level-label {
    font-size: clamp(11px, 1.3vw, 17px); font-weight: 800; color: #f2f9ff;
    text-shadow: 0 2px 6px rgba(0,0,0,.5); opacity: .95;
  }
  .hud-right { display: flex; gap: .5em; }

  .btn {
    pointer-events: auto; cursor: pointer; border: 0; font: inherit;
    font-weight: 900; color: #4a2f0d;
    background: linear-gradient(#ffe27a, #f5b419 55%, #e19c0c);
    padding: .5em 1.05em; border-radius: 999px;
    box-shadow: 0 4px 0 #a9720a, 0 10px 20px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.55);
    font-size: clamp(12px, 1.45vw, 18px);
    transition: transform .08s ease, box-shadow .08s ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a9720a, 0 5px 12px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.55); }
  .btn.ghost {
    color: #2b4664; background: linear-gradient(#ffffff, #dfe8f3 60%, #c8d6e8);
    box-shadow: 0 4px 0 #8c9cb1, 0 10px 20px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.9);
  }
  .btn.ghost:active { box-shadow: 0 1px 0 #8c9cb1, 0 5px 12px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.9); }

  .hint {
    position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%);
    color: #16324d; background: rgba(255,255,255,.85);
    font-size: clamp(10px, 1.1vw, 15px); font-weight: 800;
    padding: .42em 1em; border-radius: 999px; pointer-events: none;
    box-shadow: 0 6px 16px rgba(0,0,0,.18); white-space: nowrap;
    transition: opacity .35s ease;
  }
  .hint.hide { opacity: 0; }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 18, 30, .58); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 5;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .board {
    position: relative;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, rgba(0,0,0,0) 2px 44px),
      linear-gradient(#d19a5b, #b97f42 45%, #9d6833);
    border: 7px solid #6f4520;
    border-radius: 20px;
    padding: clamp(16px, 2.6vw, 34px) clamp(22px, 3.6vw, 52px);
    text-align: center;
    box-shadow: 0 26px 60px rgba(0,0,0,.5), inset 0 3px 0 rgba(255,255,255,.3), inset 0 -6px 0 rgba(0,0,0,.18);
    transform: scale(.88) translateY(10px); transition: transform .3s cubic-bezier(.2,1.6,.4,1);
  }
  .overlay.show .board { transform: scale(1) translateY(0); }
  .board h1 {
    font-size: clamp(20px, 3vw, 40px); color: #fff8e6; letter-spacing: 2px;
    text-shadow: 0 3px 0 #6f4520, 0 6px 14px rgba(0,0,0,.35);
  }
  .board .sub { font-size: clamp(11px, 1.3vw, 16px); color: #ffe9c4; font-weight: 800; margin-top: .3em; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .stars { display: flex; gap: clamp(6px, 1.4vw, 18px); justify-content: center; margin: .5em 0 .1em; }
  .star {
    font-size: clamp(30px, 5.4vw, 70px); line-height: 1;
    color: #6b4a24; text-shadow: 0 3px 0 rgba(0,0,0,.25);
    transform: scale(.6); opacity: .45; transition: transform .3s cubic-bezier(.2,1.8,.4,1), opacity .3s;
  }
  .star.on {
    color: #ffd642; opacity: 1;
    text-shadow: 0 0 18px rgba(255,214,66,.9), 0 4px 0 #a9720a, 0 8px 16px rgba(0,0,0,.35);
  }
  .overlay.show .star.on { transform: scale(1); }
  .overlay.show .star.on:nth-child(2) { transition-delay: .12s; }
  .overlay.show .star.on:nth-child(3) { transition-delay: .24s; }
  .board .final {
    font-size: clamp(24px, 3.6vw, 50px); font-weight: 900; color: #fff3d0;
    text-shadow: 0 3px 0 #6f4520, 0 8px 18px rgba(0,0,0,.4); font-variant-numeric: tabular-nums;
  }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1.1em; }

  .levelgrid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: clamp(6px, 1vw, 12px); margin-top: .8em;
  }
  .lv {
    cursor: pointer; border: 0; font: inherit; font-weight: 900;
    background: linear-gradient(#fff6d8, #ffd97a);
    color: #6b4321; border-radius: 14px;
    padding: .55em .2em .35em;
    box-shadow: 0 4px 0 #a9720a, 0 8px 16px rgba(0,0,0,.25);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .08s ease;
  }
  .lv:active { transform: translateY(3px); }
  .lv .n { font-size: clamp(18px, 2.4vw, 30px); line-height: 1; }
  .lv .s { font-size: clamp(10px, 1.1vw, 15px); letter-spacing: 1px; color: #b8860b; }
  .lv .s .lit { color: #e8a800; }
  .lv.locked {
    background: linear-gradient(#d9d9d9, #b9b9b9); color: #7d7d7d;
    box-shadow: 0 4px 0 #8f8f8f, 0 8px 16px rgba(0,0,0,.2); cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="score" id="score">0</div>
      <div class="level-label" id="levelLabel">第 1 关</div>
    </div>
    <div class="hud-right">
      <button class="btn ghost" id="levelsBtn">关卡</button>
      <button class="btn ghost" id="restartBtn">重玩</button>
    </div>
  </div>

  <div class="hint" id="hint">按住小鸟向后拖，松手发射</div>

  <div class="overlay" id="resultOverlay">
    <div class="board">
      <h1 id="resTitle">关卡完成！</h1>
      <div class="stars" id="resStars">
        <span class="star">★</span><span class="star">★</span><span class="star">★</span>
      </div>
      <div class="final" id="resScore">0</div>
      <div class="sub" id="resSub"></div>
      <div class="row">
        <button class="btn" id="resMain">下一关</button>
        <button class="btn ghost" id="resRetry">重玩</button>
        <button class="btn ghost" id="resLevels">关卡</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="levelOverlay">
    <div class="board">
      <h1>选择关卡</h1>
      <div class="levelgrid" id="levelGrid"></div>
      <div class="row">
        <button class="btn ghost" id="closeLevels">返回</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   愤怒的小鸟 —— 零依赖单文件版
   · 物理：自研 2D 刚体（凸多边形 + 圆），顺序冲量 + Baumgarte 校正
   · 镜头跟随、三星评分、TNT、黑鸟炸弹、6 关与关卡选择
   ===================================================================== */

/* ---------------- 常量 ---------------- */
const W = 1280, H = 720;
const GY = 620;
const GRAVITY = 1500;
const DT = 1 / 120;
const ITER = 16;
const SLOP = 0.6;
const BAUMGARTE = 0.22;
/* 静摩擦：切向速度低于阈值时把摩擦上限放大数倍，等效「粘住」，撞击瞬间也不打滑 */
const STATIC_FRICTION_BOOST = 4.0;
const STATIC_FRICTION_SPEED = 80;
/* 伤害曲线：方块 / 猪各一套 */
const DMG_MIN_SPEED = 230;      // 随飞行放慢同步下调，保持破坏手感
const PIG_HIT_SPEED = 160;
const ANCHOR = { x: 208, y: 456 };
const MAXPULL = 145;
const LAUNCH_K = 10.8;          // 原来 13.2：整体放慢约 18%
const PROGRESS_KEY = 'angry-birds-stars-v1';

/* ---------------- 数学 ---------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const mul = (a, s) => ({ x: a.x * s, y: a.y * s });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const crossSV = (s, v) => ({ x: -s * v.y, y: s * v.x });
const len = (a) => Math.hypot(a.x, a.y);
const neg = (a) => ({ x: -a.x, y: -a.y });
const norm = (a) => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l }; };
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (cur, target, k, dt) => lerp(cur, target, 1 - Math.exp(-k * dt));

/* ---------------- 刚体 ---------------- */
let uid = 0;

function makeCircle(x, y, r, opt) {
  opt = opt || {};
  const density = opt.density != null ? opt.density : 0.001;
  // 质量恒按几何计算：静态只是把倒数置零，发射时可直接启用
  const mass = Math.PI * r * r * density;
  const I = 0.5 * mass * r * r;
  const stat = !!opt.isStatic;
  return {
    id: ++uid, pos: { x, y }, vel: { x: 0, y: 0 }, angle: 0, angVel: 0,
    shape: { type: 'circle', r },
    mass, invMass: stat ? 0 : 1 / mass, I, invI: stat ? 0 : 1 / I,
    restitution: opt.restitution != null ? opt.restitution : 0.08,
    friction: opt.friction != null ? opt.friction : 0.5,
    isStatic: stat, kind: opt.kind || 'circle', tag: opt.tag || {},
    dead: false, wv: null, wn: null
  };
}

const BOX_NORMS = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }];

function makeBox(x, y, hw, hh, opt) {
  opt = opt || {};
  const density = opt.density != null ? opt.density : 0.0012;
  const mass = 4 * hw * hh * density;
  const I = (mass * (4 * hw * hw + 4 * hh * hh)) / 12;
  const stat = !!opt.isStatic;
  const b = {
    id: ++uid, pos: { x, y }, vel: { x: 0, y: 0 }, angle: opt.angle || 0, angVel: 0,
    shape: {
      type: 'poly',
      verts: [{ x: -hw, y: -hh }, { x: hw, y: -hh }, { x: hw, y: hh }, { x: -hw, y: hh }],
      norms: BOX_NORMS
    },
    mass, invMass: stat ? 0 : 1 / mass, I, invI: stat ? 0 : 1 / I,
    restitution: opt.restitution != null ? opt.restitution : 0.05,
    friction: opt.friction != null ? opt.friction : 0.6,
    isStatic: stat, kind: opt.kind || 'box', tag: opt.tag || {},
    dead: false, wv: null, wn: null
  };
  updateTransform(b);
  return b;
}

function updateTransform(b) {
  if (b.shape.type !== 'poly') return;
  const c = Math.cos(b.angle), s = Math.sin(b.angle);
  const vs = b.shape.verts, ns = b.shape.norms;
  if (!b.wv) { b.wv = vs.map(() => ({ x: 0, y: 0 })); b.wn = ns.map(() => ({ x: 0, y: 0 })); }
  for (let i = 0; i < vs.length; i++) {
    const p = vs[i];
    b.wv[i].x = b.pos.x + p.x * c - p.y * s;
    b.wv[i].y = b.pos.y + p.x * s + p.y * c;
    const n = ns[i];
    b.wn[i].x = n.x * c - n.y * s;
    b.wn[i].y = n.x * s + n.y * c;
  }
}

/* ---------------- 碰撞检测 ---------------- */
function circleCircle(a, b) {
  const d = sub(b.pos, a.pos);
  const dist = len(d);
  const r = a.shape.r + b.shape.r;
  if (dist > r) return null;
  const n = dist > 1e-6 ? mul(d, 1 / dist) : { x: 1, y: 0 };
  const pen = r - dist;
  return { normal: n, points: [{ p: add(a.pos, mul(n, a.shape.r - pen * 0.5)), sep: -pen }] };
}

function circlePoly(a, b) {
  const c = a.pos, r = a.shape.r;
  const verts = b.wv, norms = b.wn;
  let maxSep = -Infinity, bi = 0;
  for (let i = 0; i < verts.length; i++) {
    const s = dot(norms[i], sub(c, verts[i]));
    if (s > r) return null;
    if (s > maxSep) { maxSep = s; bi = i; }
  }
  if (maxSep < 1e-6) {
    const nOut = norms[bi];
    const pen = r - maxSep;
    return { normal: neg(nOut), points: [{ p: { x: c.x + nOut.x * maxSep, y: c.y + nOut.y * maxSep }, sep: -pen }] };
  }
  const v0 = verts[bi], v1 = verts[(bi + 1) % verts.length];
  const e = sub(v1, v0);
  const ee = dot(e, e) || 1;
  const t = clamp(dot(sub(c, v0), e) / ee, 0, 1);
  const cp = add(v0, mul(e, t));
  const d = sub(c, cp);
  const dist = len(d);
  if (dist > r) return null;
  const n = dist > 1e-6 ? mul(d, -1 / dist) : neg(norms[bi]);
  const pen = r - dist;
  return { normal: n, points: [{ p: cp, sep: -pen }] };
}

function maxSeparation(va, na, vb) {
  let best = -Infinity, bi = 0;
  for (let i = 0; i < va.length; i++) {
    const n = na[i];
    let minD = Infinity;
    for (let j = 0; j < vb.length; j++) {
      const d = (vb[j].x - va[i].x) * n.x + (vb[j].y - va[i].y) * n.y;
      if (d < minD) minD = d;
    }
    if (minD > best) { best = minD; bi = i; }
  }
  return { sep: best, i: bi };
}

function clipSeg(seg, n, c) {
  const out = [];
  const d0 = dot(n, seg[0]) - c, d1 = dot(n, seg[1]) - c;
  if (d0 <= 0) out.push(seg[0]);
  if (d1 <= 0) out.push(seg[1]);
  if (d0 * d1 < 0) {
    const t = d0 / (d0 - d1);
    out.push({ x: seg[0].x + t * (seg[1].x - seg[0].x), y: seg[0].y + t * (seg[1].y - seg[0].y) });
  }
  return out.length > 2 ? [out[0], out[1]] : out;
}

function polyPoly(A, B) {
  const va = A.wv, na = A.wn, vb = B.wv, nb = B.wn;
  const sa = maxSeparation(va, na, vb);
  if (sa.sep > 0) return null;
  const sb = maxSeparation(vb, nb, va);
  if (sb.sep > 0) return null;

  let refVerts, refNorms, refIdx, inc, flip;
  if (sa.sep > sb.sep - 0.001) {
    refVerts = va; refNorms = na; refIdx = sa.i; inc = B; flip = false;
  } else {
    refVerts = vb; refNorms = nb; refIdx = sb.i; inc = A; flip = true;
  }
  const refN = refNorms[refIdx];
  const v0 = refVerts[refIdx], v1 = refVerts[(refIdx + 1) % refVerts.length];

  let minD = Infinity, idx = 0;
  for (let i = 0; i < inc.wn.length; i++) {
    const d = dot(inc.wn[i], refN);
    if (d < minD) { minD = d; idx = i; }
  }
  let seg = [inc.wv[idx], inc.wv[(idx + 1) % inc.wv.length]];
  const tan = norm(sub(v1, v0));
  seg = clipSeg(seg, neg(tan), dot(neg(tan), v0));
  if (!seg.length) return null;
  seg = clipSeg(seg, tan, dot(tan, v1));
  if (!seg.length) return null;

  const pts = [];
  for (const p of seg) {
    const sep = dot(refN, sub(p, v0));
    if (sep <= 0.6) pts.push({ p, sep });
  }
  if (!pts.length) return null;
  return { normal: flip ? neg(refN) : refN, points: pts };
}

function collide(a, b) {
  const ta = a.shape.type, tb = b.shape.type;
  if (ta === 'circle' && tb === 'circle') return circleCircle(a, b);
  if (ta === 'circle' && tb === 'poly') return circlePoly(a, b);
  if (ta === 'poly' && tb === 'circle') {
    const m = circlePoly(b, a);
    if (!m) return null;
    m.normal = neg(m.normal);
    return m;
  }
  return polyPoly(a, b);
}

/* ---------------- 求解 ---------------- */
function applyImpulse(a, b, n, j, rA, rB) {
  if (!a.isStatic) {
    a.vel.x -= j * n.x * a.invMass;
    a.vel.y -= j * n.y * a.invMass;
    a.angVel -= j * cross(rA, n) * a.invI;
  }
  if (!b.isStatic) {
    b.vel.x += j * n.x * b.invMass;
    b.vel.y += j * n.y * b.invMass;
    b.angVel += j * cross(rB, n) * b.invI;
  }
}

function buildManifold(a, b, col) {
  const n = col.normal;
  const pts = [];
  for (const c of col.points) {
    const rA = sub(c.p, a.pos), rB = sub(c.p, b.pos);
    const vA = add(a.vel, crossSV(a.angVel, rA));
    const vB = add(b.vel, crossSV(b.angVel, rB));
    const vn0 = dot(sub(vB, vA), n);
    pts.push({ p: c.p, sep: c.sep, rA, rB, vn0, jn: 0, jt: 0 });
  }
  return {
    a, b, normal: n,
    mu: Math.sqrt(a.friction * b.friction),
    e: Math.max(a.restitution, b.restitution),
    pts,
    impact: Math.max.apply(null, pts.map(p => -p.vn0))
  };
}

function solveManifold(m, dt) {
  const { a, b, normal: n, mu, e, pts } = m;
  const t = { x: -n.y, y: n.x };
  for (let it = 0; it < ITER; it++) {
    for (const c of pts) {
      const vA = { x: a.vel.x - a.angVel * c.rA.y, y: a.vel.y + a.angVel * c.rA.x };
      const vB = { x: b.vel.x - b.angVel * c.rB.y, y: b.vel.y + b.angVel * c.rB.x };
      const vn = (vB.x - vA.x) * n.x + (vB.y - vA.y) * n.y;

      const rnA = cross(c.rA, n), rnB = cross(c.rB, n);
      const kn = a.invMass + b.invMass + rnA * rnA * a.invI + rnB * rnB * b.invI;
      if (kn <= 0) continue;

      const biasRaw = (BAUMGARTE / dt) * Math.max(0, -c.sep - SLOP);
      const bias = Math.min(biasRaw, 80);   // 限制位置修正注入的速度，避免深穿透物体被持续推着走
      const rest = c.vn0 < -140 ? e * (-c.vn0 - 140) : 0;
      let lambda = (-vn + bias + rest) / kn;
      const oldJn = c.jn;
      c.jn = Math.max(0, oldJn + lambda);
      lambda = c.jn - oldJn;
      applyImpulse(a, b, n, lambda, c.rA, c.rB);

      const vA2 = { x: a.vel.x - a.angVel * c.rA.y, y: a.vel.y + a.angVel * c.rA.x };
      const vB2 = { x: b.vel.x - b.angVel * c.rB.y, y: b.vel.y + b.angVel * c.rB.x };
      const vt = (vB2.x - vA2.x) * t.x + (vB2.y - vA2.y) * t.y;
      const rtA = cross(c.rA, t), rtB = cross(c.rB, t);
      const kt = a.invMass + b.invMass + rtA * rtA * a.invI + rtB * rtB * b.invI;
      if (kt <= 0) continue;
      let lt = -vt / kt;
      const muEff = Math.abs(vt) < STATIC_FRICTION_SPEED ? mu * STATIC_FRICTION_BOOST : mu;
      const maxF = muEff * c.jn;
      const oldJt = c.jt;
      c.jt = clamp(oldJt + lt, -maxF, maxF);
      lt = c.jt - oldJt;
      applyImpulse(a, b, t, lt, c.rA, c.rB);
    }
  }
}

/* ---------------- DOM ---------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* 按设备像素比渲染，线条和文字不再是模糊的放大图 */
function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineJoin = 'round';
  ctx.imageSmoothingEnabled = true;
}
fitCanvas();

/* ---------------- 音效 ---------------- */
let actx = null;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo || freq * 0.55), a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.06, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol) {
  const a = audio(); if (!a) return;
  try {
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
    const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    src.buffer = buf; g.gain.value = vol || 0.16;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  } catch (e) {}
}
const SFX = {
  launch: () => beep(520, 0.18, 'triangle', 0.07),
  hit: (v) => beep(150 + Math.min(v, 900) * 0.18, 0.09, 'square', 0.045),
  pop: () => { beep(880, 0.09, 'square', 0.07); setTimeout(() => beep(1320, 0.12, 'sine', 0.05), 60); },
  boom: () => { noise(0.45, 0.2); beep(90, 0.35, 'sawtooth', 0.08, 40); },
  win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.07), i * 110)); },
  lose: () => { [392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sine', 0.06), i * 160)); }
};

/* ---------------- 世界构建 ---------------- */
function spawnBlock(def) {
  const m = def[0], cx = def[1], w = def[2], h = def[3], bottom = def[4];
  const M = MAT[m] || MAT.wood;
  const b = makeBox(cx, bottom - h / 2, w / 2, h / 2, {
    density: M.density, friction: M.friction, restitution: M.restitution, kind: 'block'
  });
  b.tag = { mat: m, hp: M.hp, maxHp: M.hp, w, h, hitFlash: 0 };
  bodies.push(b);
}

function spawnTNT(x, bottom) {
  const M = MAT.tnt, s = 46;
  const b = makeBox(x, bottom - s / 2, s / 2, s / 2, {
    density: M.density, friction: M.friction, restitution: M.restitution, kind: 'tnt'
  });
  b.tag = { mat: 'tnt', hp: M.hp, maxHp: M.hp, w: s, h: s, hitFlash: 0, fused: 0, blink: rand(0, 3) };
  bodies.push(b);
}

function spawnPig(x, y, r) {
  const M = MAT.pig;
  const p = makeCircle(x, y, r, {
    density: M.density, friction: M.friction, restitution: M.restitution, kind: 'pig'
  });
  p.tag = { hp: M.hp, maxHp: M.hp, r, hitFlash: 0, blink: rand(0, 3) };
  bodies.push(p);
}

function buildLevel(i) {
  const L = LEVELS[i];
  game.levelIndex = i;
  bodies.length = 0;
  game.particles.length = 0;
  game.popups.length = 0;
  game.ghostTrail.length = 0;
  game.currentTrail.length = 0;
  game.birdQueue = L.birds.slice();
  game.activeBird = null;
  game.state = 'aim';
  game.flyTime = 0;
  game.stillTime = 0;
  game.shake = 0;
  game.dragging = false;

  game.worldW = Math.max(1600, L.right + 420);

  bodies.push(makeBox(game.worldW / 2, GY + 400, game.worldW / 2 + 600, 400,
    { isStatic: true, friction: 1.1, kind: 'ground' }));
  bodies.push(makeBox(-40, 300, 40, 500, { isStatic: true, friction: 0.4, kind: 'wall' }));

  for (const b of L.blocks) spawnBlock(b);
  for (const t of (L.tnt || [])) spawnTNT(t[0], t[1]);
  for (const p of L.pigs) spawnPig(p[0], p[1], p[2]);

  cam.restZoom = clamp(W / (L.right + 260), 0.62, 1);
  cam.flyZoom = clamp(cam.restZoom * 1.28, 0.8, 1.12);
  cam.zoom = cam.restZoom;
  cam.x = (W / 2) / cam.restZoom;
  cam.y = GY - 259 / cam.zoom;

  levelEl.textContent = L.name;
  hintEl.classList.remove('hide');
  resultOverlay.classList.remove('show');
  levelOverlay.classList.remove('show');
  game.paused = false;
  nextBird();
}

/* ---------------- 小鸟 ---------------- */
const BIRD_INFO = {
  red: { r: 21, density: MAT.bird.density },
  yellow: { r: 19, density: MAT.bird.density * 0.9 },
  black: { r: 23, density: MAT.bird.density * 1.35 }
};

function nextBird() {
  if (game.state === 'won' || game.state === 'lost') return;
  if (game.birdQueue.length === 0) {
    game.activeBird = null;
    setTimeout(() => {
      if (game.state === 'won' || game.state === 'lost') return;
      if (bodies.filter(b => b.kind === 'pig').length === 0) win();
      else lose();
    }, 250);
    return;
  }
  const type = game.birdQueue.shift();
  const info = BIRD_INFO[type] || BIRD_INFO.red;
  const bird = makeCircle(ANCHOR.x, ANCHOR.y, info.r, {
    density: info.density, friction: 0.5, restitution: 0.22, isStatic: true, kind: 'bird'
  });
  bird.tag = { type, launched: false, boosted: false, fuse: 0 };
  game.activeBird = bird;
  bodies.push(bird);
  game.state = 'aim';
  game.flyTime = 0;
  game.stillTime = 0;
}

function launch(pull) {
  const bird = game.activeBird;
  if (!bird) return;
  bird.isStatic = false;
  bird.invMass = 1 / bird.mass;
  bird.invI = 1 / bird.I;
  const v = mul(pull, -LAUNCH_K);
  const sp = len(v);
  bird.vel = sp > 1700 ? mul(norm(v), 1700) : v;
  bird.angVel = rand(-2, 2);
  bird.tag.launched = true;
  game.state = 'fly';
  game.flyTime = 0;
  game.stillTime = 0;
  game.ghostTrail.length = 0;
  game.currentTrail.length = 0;
  hintEl.classList.add('hide');
  SFX.launch();
  for (let i = 0; i < 10; i++) {
    pushParticle(bird.pos.x, bird.pos.y, rand(-90, 90), rand(-90, 60), rand(2, 5), 'rgba(255,255,255,.85)', 0.4);
  }
}

/* ---------------- 特效 / 伤害 ---------------- */
function pushParticle(x, y, vx, vy, size, color, life) {
  game.particles.push({ x, y, vx, vy, size, color, life, maxLife: life, rot: rand(0, 6.28), vr: rand(-8, 8) });
}
function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 260) * (power || 1);
    pushParticle(x, y, Math.cos(a) * s, Math.sin(a) * s - 60, rand(2, 7), color, rand(0.4, 0.9));
  }
}
function popup(x, y, text, color) {
  game.popups.push({ x, y, text, color: color || '#fff', life: 1.1, maxLife: 1.1 });
}
function addScore(v, x, y) {
  game.score += v;
  scoreEl.textContent = game.score;
  if (x != null) popup(x, y - 18, '+' + v, v >= 5000 ? '#ffe36e' : '#ffffff');
}

function damageBlock(b, amount, x, y) {
  if (b.dead) return;
  b.tag.hp -= amount;
  b.tag.hitFlash = 0.18;
  if (b.tag.hp <= 0) {
    b.dead = true;
    const mat = b.tag.mat;
    const col = mat === 'wood' ? '#c98a3f' : mat === 'ice' ? '#bfe9ff' : '#9aa2ab';
    burst(b.pos.x, b.pos.y, col, 14, 1.1);
    addScore(500, b.pos.x, b.pos.y);
    SFX.hit(400);
  } else if (amount > 120) {
    burst(x, y, 'rgba(255,255,255,.7)', 4, 0.5);
  }
}

function damagePig(p, amount, x, y) {
  if (p.dead) return;
  p.tag.hp -= amount;
  p.tag.hitFlash = 0.2;
  if (p.tag.hp <= 0) {
    p.dead = true;
    burst(p.pos.x, p.pos.y, '#8fd14f', 18, 1.2);
    burst(p.pos.x, p.pos.y, '#ffffff', 8, 0.7);
    addScore(5000, p.pos.x, p.pos.y);
    game.shake = Math.max(game.shake, 9);
    SFX.pop();
  } else {
    burst(x, y, 'rgba(255,255,255,.8)', 3, 0.4);
  }
}

function triggerTNT(b) {
  if (b.dead || b.tag.fused > 0) return;
  b.tag.fused = 0.0001;
  beep(300, 0.1, 'square', 0.05);
}

function explode(x, y, radius, power, dmg) {
  game.shake = Math.max(game.shake, 20);
  burst(x, y, '#ffb347', 26, 1.8);
  burst(x, y, '#ff5f2e', 18, 1.3);
  burst(x, y, 'rgba(90,90,90,.9)', 14, 1.0);
  SFX.boom();
  const snapshot = bodies.slice();
  for (const b of snapshot) {
    if (b.isStatic || b.dead) continue;
    const d = sub(b.pos, { x, y });
    const dist = len(d) || 1;
    if (dist > radius) continue;
    const f = 1 - dist / radius;
    const n = mul(d, 1 / dist);
    const dv = power * f;
    b.vel.x += n.x * dv;
    b.vel.y += n.y * dv - dv * 0.4;
    b.angVel += rand(-5, 5) * f;
    if (b.kind === 'pig') damagePig(b, dmg * f, b.pos.x, b.pos.y);
    else if (b.kind === 'block') damageBlock(b, dmg * f * 0.85, b.pos.x, b.pos.y);
    else if (b.kind === 'tnt') triggerTNT(b);
  }
}

/* ---------------- 物理步进 ---------------- */
function physicsStep(dt) {
  for (const b of bodies) {
    if (b.isStatic || b.dead) continue;
    b.vel.y += GRAVITY * dt;
    b.vel.x *= 0.9995;
    b.vel.y *= 0.9995;
    b.angVel *= 0.998;
    const sp = len(b.vel);
    if (sp > 3200) b.vel = mul(b.vel, 3200 / sp);
    b.angVel = clamp(b.angVel, -32, 32);
  }

  const manifolds = [];
  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    if (a.dead) continue;
    for (let j = i + 1; j < bodies.length; j++) {
      const b = bodies[j];
      if (b.dead) continue;
      if (a.isStatic && b.isStatic) continue;
      const col = collide(a, b);
      if (!col) continue;
      manifolds.push(buildManifold(a, b, col));
    }
  }

  for (const m of manifolds) {
    const speed = m.impact;
    if (speed < PIG_HIT_SPEED) continue;
    const blockDmg = speed > DMG_MIN_SPEED ? (speed - DMG_MIN_SPEED) * 0.72 : 0;
    // 猪比方块脆：阈值更低、系数更高，摔一下就要掉大半血
    const pigDmg = (speed - PIG_HIT_SPEED) * 0.8;
    const cp = m.pts[0].p;

    const bird = game.activeBird;
    if (bird && bird.tag.type === 'black' && !bird.tag.fused &&
        (m.a === bird || m.b === bird) && speed > 300) {
      bird.tag.fused = 0.0001;
    }

    for (const body of [m.a, m.b]) {
      if (body.kind === 'pig') damagePig(body, pigDmg, cp.x, cp.y);
      else if (body.kind === 'block') damageBlock(body, blockDmg * 0.9, cp.x, cp.y);
      else if (body.kind === 'tnt' && blockDmg > 60) triggerTNT(body);
    }
    if (blockDmg > 200) {
      game.shake = Math.max(game.shake, Math.min(16, blockDmg * 0.012));
      if (Math.random() < 0.5) SFX.hit(speed);
    }
  }

  for (const m of manifolds) solveManifold(m, dt);

  for (const b of bodies) {
    if (b.isStatic || b.dead) continue;
    // 求解后残余的微小速度直接归零：堆叠体不会缓慢蠕移
    if (Math.abs(b.vel.x) < 14 && Math.abs(b.vel.y) < 14 && Math.abs(b.angVel) < 0.12) {
      b.vel.x = 0;
      b.vel.y = 0;
      b.angVel = 0;
    }
    b.pos.x += b.vel.x * dt;
    b.pos.y += b.vel.y * dt;
    b.angle += b.angVel * dt;
    updateTransform(b);
  }
}

function cleanupBodies() {
  for (const b of bodies) {
    if (b.isStatic || b.dead) continue;
    // NaN 兜底：任何数值异常都不允许扩散到整个场景
    if (!Number.isFinite(b.pos.x) || !Number.isFinite(b.pos.y) ||
        !Number.isFinite(b.vel.x) || !Number.isFinite(b.vel.y) ||
        !Number.isFinite(b.angle) || !Number.isFinite(b.angVel)) {
      b.dead = true;
      continue;
    }
    if (b.pos.y > H + 600 || b.pos.x < -400 || b.pos.x > game.worldW + 500) {
      b.dead = true;
      if (b.kind === 'pig') addScore(5000, b.pos.x, b.pos.y);
    }
  }
}

/* ---------------- 输入 ---------------- */
function toWorld(evt) {
  const r = cv.getBoundingClientRect();
  const sx = (evt.clientX - r.left) * (W / r.width);
  const sy = (evt.clientY - r.top) * (H / r.height);
  return {
    x: (sx - W / 2) / cam.zoom + cam.x,
    y: (sy - H / 2) / cam.zoom + cam.y
  };
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audio();
  if (game.paused) return;
  const p = toWorld(e);
  const bird = game.activeBird;

  if (game.state === 'aim' && bird && !game.dragging) {
    if (len(sub(p, bird.pos)) < 240) {
      game.dragging = true;
      cv.setPointerCapture(e.pointerId);
      hintEl.classList.add('hide');
      return;
    }
  }

  if (game.state === 'fly' && bird && !bird.tag.boosted) {
    if (bird.tag.type === 'yellow') {
      bird.tag.boosted = true;
      const sp = len(bird.vel);
      bird.vel = mul(norm(bird.vel), Math.min(2100, sp * 1.85 + 220));
      beep(760, 0.14, 'sawtooth', 0.05);
      for (let i = 0; i < 12; i++) {
        pushParticle(bird.pos.x, bird.pos.y, rand(-180, 60), rand(-70, 70), rand(2, 5), 'rgba(255,220,120,.9)', 0.4);
      }
    } else if (bird.tag.type === 'black') {
      bird.tag.fused = 0.0001;
      bird.tag.boosted = true;
    }
  }
});

cv.addEventListener('pointermove', (e) => {
  if (!game.dragging || !game.activeBird) return;
  e.preventDefault();
  const p = toWorld(e);
  const d = sub(p, ANCHOR);
  const dist = len(d);
  const dd = dist > MAXPULL ? mul(d, MAXPULL / dist) : d;
  const np = add(ANCHOR, dd);
  if (np.y > GY - 18) np.y = GY - 18;
  game.activeBird.pos = np;
  game.activeBird.angle = Math.atan2(np.y - ANCHOR.y, np.x - ANCHOR.x) + Math.PI;
});

cv.addEventListener('pointerup', (e) => {
  if (!game.dragging || !game.activeBird) return;
  e.preventDefault();
  const bird = game.activeBird;
  game.dragging = false;
  const pull = sub(bird.pos, ANCHOR);
  if (len(pull) < 14) {
    bird.pos = { x: ANCHOR.x, y: ANCHOR.y };
    bird.angle = 0;
    return;
  }
  launch(pull);
});

cv.addEventListener('pointercancel', () => {
  if (game.dragging && game.activeBird) {
    game.dragging = false;
    game.activeBird.pos = { x: ANCHOR.x, y: ANCHOR.y };
    game.activeBird.angle = 0;
  }
});

/* ---------------- 状态推进 ---------------- */
function updateGameState(dt) {
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 42);

  for (const b of bodies) {
    if (b.kind === 'tnt' && b.tag.fused > 0 && !b.dead) {
      b.tag.fused += dt;
      if (b.tag.fused > 0.14) {
        b.dead = true;
        explode(b.pos.x, b.pos.y, 240, 1050, 1250);
        addScore(200, b.pos.x, b.pos.y - 30);
      }
    }
    if (b.tag && b.tag.hitFlash > 0) b.tag.hitFlash -= dt;
  }

  const ab = game.activeBird;
  if (ab && ab.tag.type === 'black' && ab.tag.fused > 0 && !ab.dead) {
    ab.tag.fused += dt;
    if (ab.tag.fused > 0.1) {
      ab.dead = true;
      explode(ab.pos.x, ab.pos.y, 260, 1250, 1500);
      game.activeBird = null;
      game.state = 'wait';
      game.stillTime = 0;
      if (game.currentTrail.length > 4) game.ghostTrail = game.currentTrail.slice();
    }
  }

  for (let i = bodies.length - 1; i >= 0; i--) if (bodies[i].dead) bodies.splice(i, 1);

  const pigs = bodies.filter(b => b.kind === 'pig').length;
  if (pigs === 0 && game.state !== 'won' && game.state !== 'lost') { win(); return; }

  if (game.state === 'fly') {
    game.flyTime += dt;
    const bird = game.activeBird;
    const alive = bird && !bird.dead && bodies.indexOf(bird) >= 0;
    if (alive) {
      game.trailTimer -= dt;
      if (game.trailTimer <= 0 && len(bird.vel) > 120) {
        game.trailTimer = 0.035;
        game.currentTrail.push({ x: bird.pos.x, y: bird.pos.y });
      }
      const sp = len(bird.vel);
      const nearGround = bird.pos.y > GY - bird.shape.r - 8;
      if (sp < 60 || (nearGround && sp < 240)) game.stillTime += dt; else game.stillTime = 0;
      if (game.stillTime > 0.55 || game.flyTime > 6.5 || bird.pos.y > GY + 260 || bird.pos.x > game.worldW + 200) {
        const idx = bodies.indexOf(bird);
        if (idx >= 0) bodies.splice(idx, 1);
        game.activeBird = null;
        game.state = 'wait';
        game.stillTime = 0;
        if (game.currentTrail.length > 4) game.ghostTrail = game.currentTrail.slice();
      }
    } else {
      game.state = 'wait';
      game.stillTime = 0;
      if (game.currentTrail.length > 4) game.ghostTrail = game.currentTrail.slice();
    }
  } else if (game.state === 'wait') {
    let moving = false;
    for (const b of bodies) {
      if (b.isStatic) continue;
      if (len(b.vel) > 26 || Math.abs(b.angVel) > 1.2) { moving = true; break; }
    }
    game.stillTime = moving ? 0 : game.stillTime + dt;
    if (game.stillTime > 0.6) {
      game.stillTime = 0;
      if (bodies.filter(b => b.kind === 'pig').length === 0) win();
      else if (game.birdQueue.length === 0) lose();
      else nextBird();
    }
  }
}

/* ---------------- 镜头 ---------------- */
function updateCamera(dt) {
  let targetZoom, targetX;

  if (game.state === 'fly' && game.activeBird) {
    targetZoom = cam.flyZoom;
    targetX = game.activeBird.pos.x + 120;
  } else if (game.state === 'wait') {
    targetZoom = cam.flyZoom;
    targetX = cam.x;
  } else {
    targetZoom = cam.restZoom;
    targetX = (W / 2) / cam.restZoom;
  }

  const halfW = (W / 2) / targetZoom;
  targetX = clamp(targetX, halfW - 40, Math.max(halfW - 40, game.worldW - halfW + 40));

  cam.zoom = approach(cam.zoom, targetZoom, 6, dt);
  cam.x = approach(cam.x, targetX, 5, dt);
  cam.y = approach(cam.y, GY - 259 / cam.zoom, 8, dt);
}

/* ---------------- 绘制：背景 ---------------- */
const clouds = [
  { x: 160, y: 110, s: 1.0, sp: 7 },
  { x: 640, y: 70, s: 0.72, sp: 5 },
  { x: 1080, y: 140, s: 1.15, sp: 9 },
  { x: 380, y: 190, s: 0.6, sp: 11 }
];

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4ea9e2');
  g.addColorStop(0.5, '#8ed2f3');
  g.addColorStop(1, '#d6eefa');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  const sg = ctx.createRadialGradient(1080, 100, 10, 1080, 100, 220);
  sg.addColorStop(0, 'rgba(255,250,210,.95)');
  sg.addColorStop(0.4, 'rgba(255,238,170,.35)');
  sg.addColorStop(1, 'rgba(255,238,170,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(820, -120, 500, 460);
  ctx.restore();

  const par = cam.x * cam.zoom;
  for (const c of clouds) {
    const x = ((c.x + t * c.sp - par * 0.12) % (W + 500) + W + 500) % (W + 500) - 250;
    drawCloud(x, c.y, c.s);
  }
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.arc(0, 0, 34, 0, 6.2832);
  ctx.arc(38, 8, 26, 0, 6.2832);
  ctx.arc(-36, 10, 24, 0, 6.2832);
  ctx.arc(10, -20, 28, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

function drawHills() {
  const par = cam.x * cam.zoom;
  const groundY = (GY - cam.y) * cam.zoom + H / 2;

  ctx.fillStyle = '#9fd98a';
  ctx.beginPath();
  ctx.moveTo(-200, groundY + 60);
  const farOff = -par * 0.18;
  for (let i = 0; i <= 8; i++) {
    const x = -200 + i * 420 + (farOff % 420);
    ctx.quadraticCurveTo(x + 210, groundY - 190, x + 420, groundY + 40);
  }
  ctx.lineTo(W + 400, groundY + 90);
  ctx.lineTo(-200, groundY + 90);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#7fc46a';
  ctx.beginPath();
  ctx.moveTo(-200, groundY + 80);
  const nearOff = -par * 0.34;
  for (let i = 0; i <= 6; i++) {
    const x = -250 + i * 520 + (nearOff % 520);
    ctx.quadraticCurveTo(x + 260, groundY - 110, x + 520, groundY + 60);
  }
  ctx.lineTo(W + 400, groundY + 130);
  ctx.lineTo(-200, groundY + 130);
  ctx.closePath();
  ctx.fill();

  // 小树剪影（实心，落在山脊线上）
  ctx.fillStyle = '#57a04a';
  for (let i = 0; i < 8; i++) {
    const bx = i * 260 + (nearOff % 260);
    const x = ((bx + 40) % (W + 400)) - 200;
    treeOnHill(x, groundY - 34, 0.85);
  }
}

function treeOnHill(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = '#6b4a26';
  ctx.fillRect(-4, -18, 8, 20);
  ctx.fillStyle = '#57a04a';
  ctx.beginPath();
  ctx.arc(0, -34, 24, 0, 6.2832);
  ctx.arc(-16, -20, 17, 0, 6.2832);
  ctx.arc(16, -20, 17, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath();
  ctx.arc(-6, -42, 12, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

/* ---------------- 绘制：世界 ---------------- */
function drawGround() {
  ctx.fillStyle = '#6ab04c';
  ctx.fillRect(-500, GY, game.worldW + 1200, 26);
  ctx.fillStyle = '#579f3c';
  ctx.fillRect(-500, GY + 18, game.worldW + 1200, 10);

  const g = ctx.createLinearGradient(0, GY + 26, 0, H + 200);
  g.addColorStop(0, '#a9743f');
  g.addColorStop(1, '#78501f');
  ctx.fillStyle = g;
  ctx.fillRect(-500, GY + 26, game.worldW + 1200, 600);

  ctx.strokeStyle = 'rgba(0,0,0,.07)';
  ctx.lineWidth = 2;
  for (let x = 20; x < game.worldW; x += 64) {
    ctx.beginPath();
    ctx.moveTo(x, GY + 40);
    ctx.lineTo(x + 26, H + 200);
    ctx.stroke();
  }

  ctx.strokeStyle = '#4d9636';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let x = 0; x < game.worldW; x += 17) {
    const hgt = 6 + ((x * 7) % 9);
    ctx.beginPath();
    ctx.moveTo(x, GY + 2);
    ctx.quadraticCurveTo(x + 3, GY - hgt * 0.6, x + 6, GY - hgt);
    ctx.stroke();
  }
}

function slingTips() {
  return {
    base: { x: ANCHOR.x - 4, y: GY },
    fork: { x: ANCHOR.x - 2, y: ANCHOR.y + 56 },
    left: { x: ANCHOR.x - 36, y: ANCHOR.y - 24 },
    right: { x: ANCHOR.x + 36, y: ANCHOR.y - 4 }
  };
}

/* 皮筋连到小鸟边缘而不是圆心，避免横穿脸部 */
function pouchPoint(center, r, from) {
  const d = sub(from, center);
  const l = len(d) || 1;
  return { x: center.x + d.x / l * r, y: center.y + d.y / l * r };
}

function drawSlingshot(behind) {
  if (!behind) return;   // 皮筋与木叉全部画在小鸟之前，鸟才能完整压在上面

  const t = slingTips();
  const aiming = game.state === 'aim' && game.activeBird;
  const bp = aiming ? game.activeBird.pos : { x: ANCHOR.x, y: ANCHOR.y - 14 };
  const br = aiming ? game.activeBird.shape.r * 0.92 : 0;
  ctx.lineCap = 'round';

  // 后侧皮筋
  const pL = aiming ? pouchPoint(bp, br, t.left) : bp;
  ctx.strokeStyle = '#4a2414';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(t.left.x, t.left.y);
  ctx.lineTo(pL.x, pL.y);
  ctx.stroke();

  // 前侧皮筋（同样在鸟之后绘制，避免横穿脸部）
  const pR = aiming ? pouchPoint(bp, br, t.right) : bp;
  ctx.strokeStyle = '#5d2d18';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(t.right.x, t.right.y);
  ctx.lineTo(pR.x, pR.y);
  ctx.stroke();

  drawProngs(t);
}

function drawProngs(t) {
  ctx.lineCap = 'round';
  // 主干
  ctx.strokeStyle = '#6b3f1d';
  ctx.lineWidth = 26;
  ctx.beginPath();
  ctx.moveTo(t.base.x, t.base.y);
  ctx.lineTo(t.fork.x, t.fork.y);
  ctx.stroke();

  // 两根叉，明确分开成 Y 形
  ctx.strokeStyle = '#8b5527';
  ctx.lineWidth = 17;
  ctx.beginPath();
  ctx.moveTo(t.fork.x, t.fork.y);
  ctx.lineTo(t.left.x, t.left.y);
  ctx.moveTo(t.fork.x, t.fork.y);
  ctx.lineTo(t.right.x, t.right.y);
  ctx.stroke();

  // 叉尖圆头，让末端更厚实
  ctx.fillStyle = '#8b5527';
  ctx.beginPath();
  ctx.arc(t.left.x, t.left.y, 8.5, 0, 6.2832);
  ctx.arc(t.right.x, t.right.y, 8.5, 0, 6.2832);
  ctx.fill();

  // 主干高光
  ctx.strokeStyle = 'rgba(255,225,190,.3)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(t.base.x - 7, t.base.y - 10);
  ctx.lineTo(t.fork.x - 7, t.fork.y + 6);
  ctx.stroke();
}

/* scale: 贴图边长 = 半径 × scale */
const BIRD_SPRITE = {
  red: { scale: 3.1, dy: 0 },
  yellow: { scale: 3.3, dy: 0 },
  black: { scale: 2.7, dy: 0 }
};
const birdArt = { red: null, yellow: null, black: null };
(function initBirdArt() {
  for (const k of Object.keys(BIRD_SRC)) {
    try {
      const img = new Image();
      const state = { img: null, ready: false };
      img.addEventListener('load', () => { state.ready = true; });
      img.addEventListener('error', () => { state.ready = false; });
      img.src = BIRD_SRC[k];
      state.img = img;
      birdArt[k] = state;
    } catch (e) {
      birdArt[k] = { img: null, ready: false };
    }
  }
})();

function drawBird(body, override) {
  const type = override || (body.tag && body.tag.type) || 'red';
  const art = birdArt[type];
  const cfg = BIRD_SPRITE[type];
  if (!art || !art.ready || !cfg) { drawBirdProcedural(body, type); return; }

  const size = body.shape.r * cfg.scale;
  ctx.save();
  ctx.translate(body.pos.x, body.pos.y);
  ctx.rotate(body.angle || 0);
  ctx.drawImage(art.img, -size / 2, -size / 2 + (cfg.dy || 0), size, size);
  ctx.restore();
}

function drawBirdProcedural(body, override) {
  const type = override || (body.tag && body.tag.type) || 'red';
  const r = body.shape.r;
  ctx.save();
  ctx.translate(body.pos.x, body.pos.y);
  ctx.rotate(body.angle || 0);

  if (type === 'yellow') {
    ctx.fillStyle = '#e8a516';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, i * r * 0.35);
      ctx.lineTo(-r * 1.45, i * r * 0.66 - r * 0.12);
      ctx.lineTo(-r * 0.75, i * r * 0.35 + r * 0.26);
      ctx.closePath();
      ctx.fill();
    }
    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.2, 0, 0, r * 1.15);
    g.addColorStop(0, '#ffd24a');
    g.addColorStop(0.6, '#f2b119');
    g.addColorStop(1, '#c98a06');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-r * 0.95, -r * 0.35);
    ctx.quadraticCurveTo(-r * 0.2, -r * 1.25, r * 0.55, -r * 0.75);
    ctx.quadraticCurveTo(r * 1.36, -r * 0.2, r * 0.7, r * 0.72);
    ctx.quadraticCurveTo(0, r * 1.32, -r * 0.75, r * 0.6);
    ctx.quadraticCurveTo(-r * 1.2, 0, -r * 0.95, -r * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,0,.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#f08c1a';
    ctx.beginPath();
    ctx.moveTo(r * 0.5, -r * 0.02);
    ctx.lineTo(r * 1.3, r * 0.16);
    ctx.lineTo(r * 0.5, r * 0.36);
    ctx.closePath();
    ctx.fill();
    eyesAndBrows(r, 0.24, 0.62, 0.28, 0.24, '#7a4a05', false);
  } else if (type === 'black') {
    ctx.fillStyle = '#3a3a3a';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, i * r * 0.35);
      ctx.lineTo(-r * 1.4, i * r * 0.62 - r * 0.1);
      ctx.lineTo(-r * 0.72, i * r * 0.35 + r * 0.24);
      ctx.closePath();
      ctx.fill();
    }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r * 1.12);
    g.addColorStop(0, '#5d5d5d');
    g.addColorStop(0.65, '#2f2f2f');
    g.addColorStop(1, '#141414');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = '#c9a227';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.2, -r * 1.5, -r * 0.2, -r * 1.65);
    ctx.stroke();
    ctx.fillStyle = '#f6a623';
    ctx.beginPath();
    ctx.moveTo(r * 0.55, -r * 0.05);
    ctx.lineTo(r * 1.2, r * 0.14);
    ctx.lineTo(r * 0.55, r * 0.32);
    ctx.closePath();
    ctx.fill();
    eyesAndBrows(r, 0.22, 0.6, 0.26, 0.22, '#111', true);
  } else {
    ctx.fillStyle = '#8f1c1c';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-r * 0.75, i * r * 0.42);
      ctx.lineTo(-r * 1.55, i * r * 0.75 - r * 0.15);
      ctx.lineTo(-r * 0.8, i * r * 0.42 + r * 0.3);
      ctx.closePath();
      ctx.fill();
    }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.2, 0, 0, r * 1.12);
    g.addColorStop(0, '#f05a4a');
    g.addColorStop(0.6, '#d3271c');
    g.addColorStop(1, '#9c150f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,10,10,.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,235,210,.95)';
    ctx.beginPath();
    ctx.ellipse(r * 0.12, r * 0.42, r * 0.5, r * 0.34, 0, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = '#f6a623';
    ctx.beginPath();
    ctx.moveTo(r * 0.62, -r * 0.05);
    ctx.lineTo(r * 1.34, r * 0.12);
    ctx.lineTo(r * 0.6, r * 0.34);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d8830d';
    ctx.beginPath();
    ctx.moveTo(r * 0.62, r * 0.12);
    ctx.lineTo(r * 1.34, r * 0.12);
    ctx.lineTo(r * 0.6, r * 0.34);
    ctx.closePath();
    ctx.fill();
    eyesAndBrows(r, 0.3, 0.66, 0.3, 0.26, '#5e0f0a', false);
  }
  ctx.restore();
}

function eyesAndBrows(r, x1, x2, r1, r2, browColor, angryBoth) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * x1, -r * 0.34, r * r1, 0, 6.2832);
  ctx.arc(r * x2, -r * 0.3, r * r2, 0, 6.2832);
  ctx.fill();
  // 眼白描边，轮廓更清楚
  ctx.strokeStyle = 'rgba(30,20,10,.28)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(r * x1, -r * 0.34, r * r1, 0, 6.2832);
  ctx.arc(r * x2, -r * 0.3, r * r2, 0, 6.2832);
  ctx.stroke();
  ctx.fillStyle = '#20160f';
  ctx.beginPath();
  ctx.arc(r * (x1 + 0.1), -r * 0.34, r * 0.12, 0, 6.2832);
  ctx.arc(r * (x2 + 0.06), -r * 0.3, r * 0.11, 0, 6.2832);
  ctx.fill();
  // 瞳孔高光
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  ctx.arc(r * (x1 + 0.05), -r * 0.39, r * 0.045, 0, 6.2832);
  ctx.arc(r * (x2 + 0.01), -r * 0.35, r * 0.04, 0, 6.2832);
  ctx.fill();
  ctx.strokeStyle = browColor;
  ctx.lineWidth = r * 0.1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(r * (x1 - 0.3), -r * 0.86);
  ctx.lineTo(r * (x1 + 0.26), -r * 0.66);
  ctx.moveTo(r * (x2 + 0.3), -r * 0.82);
  ctx.lineTo(r * (x2 - 0.18), -r * 0.64);
  ctx.stroke();
}

const pigHead = { img: null, ready: false };
(function initPigHead() {
  try {
    const img = new Image();
    img.addEventListener('load', () => { pigHead.ready = true; });
    img.addEventListener('error', () => { pigHead.ready = false; });
    img.src = PIG_HEAD_SRC;
    pigHead.img = img;
  } catch (e) {
    pigHead.ready = false;
  }
})();

function drawPig(p) {
  const r = p.tag.r;

  if (!pigHead.ready) { drawPigProcedural(p); return; }

  const dw = r * 2.5;
  const dh = dw * (250 / 262);
  const oy = -dh * 0.11;          // 脸部中心对准碰撞圆心
  const t = game.time;
  const hurt = p.tag.hp / p.tag.maxHp;

  ctx.save();
  ctx.translate(p.pos.x, p.pos.y);
  ctx.rotate(p.angle || 0);

  // 呼吸感的轻微挤压
  const sq = 1 + Math.sin(t * 2 + p.tag.blink) * 0.02;
  ctx.scale(1 / sq, sq);
  ctx.drawImage(pigHead.img, -dw / 2, -dh / 2 + oy, dw, dh);

  // 受伤后脸上泛红，越接近死亡越明显
  if (hurt < 0.66) {
    ctx.globalAlpha = (1 - hurt) * 0.4;
    ctx.fillStyle = '#8a1a1a';
    ctx.beginPath();
    ctx.ellipse(0, dh * 0.1, dw * 0.3, dh * 0.28, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 受击白闪
  if (p.tag.hitFlash > 0) {
    ctx.globalAlpha = Math.min(0.85, p.tag.hitFlash * 2.2);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(0, dh * 0.1, dw * 0.33, dh * 0.29, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawPigProcedural(p) {
  const r = p.tag.r;
  const t = game.time;
  const hurt = p.tag.hp / p.tag.maxHp;
  ctx.save();
  ctx.translate(p.pos.x, p.pos.y);
  ctx.rotate(p.angle || 0);

  const sq = 1 + Math.sin(t * 2 + p.tag.blink) * 0.025;
  ctx.scale(1 / sq, sq);

  ctx.fillStyle = '#6aa832';
  ctx.beginPath();
  ctx.moveTo(-r * 0.62, -r * 0.72);
  ctx.lineTo(-r * 0.95, -r * 1.16);
  ctx.lineTo(-r * 0.28, -r * 0.92);
  ctx.closePath();
  ctx.moveTo(r * 0.62, -r * 0.72);
  ctx.lineTo(r * 0.95, -r * 1.16);
  ctx.lineTo(r * 0.28, -r * 0.92);
  ctx.closePath();
  ctx.fill();
  // 耳朵内侧
  ctx.fillStyle = '#4c8820';
  ctx.beginPath();
  ctx.moveTo(-r * 0.65, -r * 0.79);
  ctx.lineTo(-r * 0.88, -r * 1.05);
  ctx.lineTo(-r * 0.42, -r * 0.93);
  ctx.closePath();
  ctx.moveTo(r * 0.65, -r * 0.79);
  ctx.lineTo(r * 0.88, -r * 1.05);
  ctx.lineTo(r * 0.42, -r * 0.93);
  ctx.closePath();
  ctx.fill();

  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.2, 0, 0, r * 1.1);
  g.addColorStop(0, '#a8e05a');
  g.addColorStop(0.62, '#7cbb34');
  g.addColorStop(1, '#548c1d');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 6.2832);
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,70,10,.35)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#8fce45';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.2, r * 0.44, r * 0.33, 0, 0, 6.2832);
  ctx.fill();
  // 鼻子高光
  ctx.fillStyle = 'rgba(255,255,255,.32)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.1, r * 0.08, r * 0.2, r * 0.1, -0.25, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = '#3f6b12';
  ctx.beginPath();
  ctx.ellipse(-r * 0.17, r * 0.2, r * 0.09, r * 0.13, 0, 0, 6.2832);
  ctx.ellipse(r * 0.17, r * 0.2, r * 0.09, r * 0.13, 0, 0, 6.2832);
  ctx.fill();

  const blink = Math.sin(t * 1.7 + p.tag.blink) > 0.97;
  if (blink) {
    ctx.strokeStyle = '#20340a';
    ctx.lineWidth = r * 0.1;
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 0.24);
    ctx.lineTo(-r * 0.16, -r * 0.24);
    ctx.moveTo(r * 0.16, -r * 0.24);
    ctx.lineTo(r * 0.5, -r * 0.24);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-r * 0.33, -r * 0.28, r * 0.27, 0, 6.2832);
    ctx.arc(r * 0.33, -r * 0.28, r * 0.27, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = '#1a2a06';
    ctx.beginPath();
    ctx.arc(-r * 0.27, -r * 0.28, r * 0.12, 0, 6.2832);
    ctx.arc(r * 0.39, -r * 0.28, r * 0.12, 0, 6.2832);
    ctx.fill();
  }

  if (hurt < 0.66) {
    ctx.strokeStyle = '#2f4a0d';
    ctx.lineWidth = r * 0.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.6, -r * 0.66);
    ctx.lineTo(-r * 0.14, -r * 0.5);
    ctx.moveTo(r * 0.6, -r * 0.66);
    ctx.lineTo(r * 0.14, -r * 0.5);
    ctx.stroke();
  }
  if (hurt < 0.4) {
    ctx.save();
    ctx.rotate(-0.5);
    ctx.fillStyle = '#f4e3c8';
    ctx.strokeStyle = '#c9b291';
    ctx.lineWidth = 2;
    ctx.fillRect(r * 0.35, r * 0.3, r * 0.5, r * 0.26);
    ctx.strokeRect(r * 0.35, r * 0.3, r * 0.5, r * 0.26);
    ctx.restore();
  }

  if (p.tag.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (p.tag.hitFlash * 2.2) + ')';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBlock(b) {
  const mat = b.tag.mat;
  const hw = b.tag.w / 2, hh = b.tag.h / 2;
  ctx.save();
  ctx.translate(b.pos.x, b.pos.y);
  ctx.rotate(b.angle);

  if (mat === 'wood') {
    const g = ctx.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, '#dda65c');
    g.addColorStop(0.5, '#c2833a');
    g.addColorStop(1, '#a4682a');
    ctx.fillStyle = g;
    roundRect(-hw, -hh, hw * 2, hh * 2, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(78,44,12,.75)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,72,24,.3)';
    ctx.lineWidth = 1.6;
    if (b.tag.w > b.tag.h) {
      for (let yy = -hh + 7; yy < hh; yy += 9) {
        ctx.beginPath();
        ctx.moveTo(-hw + 5, yy);
        ctx.lineTo(hw - 5, yy + 1.5);
        ctx.stroke();
      }
    } else {
      for (let xx = -hw + 7; xx < hw; xx += 9) {
        ctx.beginPath();
        ctx.moveTo(xx, -hh + 5);
        ctx.lineTo(xx + 1.5, hh - 5);
        ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(70,45,18,.55)';
    ctx.beginPath();
    ctx.arc(-hw + 5, -hh + 5, 2, 0, 6.2832);
    ctx.arc(hw - 5, -hh + 5, 2, 0, 6.2832);
    ctx.arc(-hw + 5, hh - 5, 2, 0, 6.2832);
    ctx.arc(hw - 5, hh - 5, 2, 0, 6.2832);
    ctx.fill();
  } else if (mat === 'ice') {
    const g = ctx.createLinearGradient(-hw, -hh, hw, hh);
    g.addColorStop(0, 'rgba(220,247,255,.9)');
    g.addColorStop(0.5, 'rgba(155,222,250,.8)');
    g.addColorStop(1, 'rgba(108,194,238,.85)');
    ctx.fillStyle = g;
    roundRect(-hw, -hh, hw * 2, hh * 2, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.5, hh * 0.7);
    ctx.lineTo(hw * 0.2, -hh * 0.5);
    ctx.moveTo(-hw * 0.1, hh * 0.8);
    ctx.lineTo(hw * 0.55, -hh * 0.2);
    ctx.stroke();
  } else if (mat === 'tnt') {
    const g = ctx.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, '#d9542b');
    g.addColorStop(0.55, '#b8361a');
    g.addColorStop(1, '#8e2510');
    ctx.fillStyle = g;
    roundRect(-hw, -hh, hw * 2, hh * 2, 5);
    ctx.fill();
    ctx.strokeStyle = '#5d1a08';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,200,.92)';
    ctx.fillRect(-hw * 0.72, -hh * 0.3, hw * 1.44, hh * 0.6);
    ctx.fillStyle = '#7a1d05';
    ctx.font = '900 ' + Math.round(hw * 0.66) + 'px "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TNT', 0, hh * 0.02);
    if (b.tag.fused > 0) {
      ctx.fillStyle = 'rgba(255,220,120,' + (0.35 + Math.sin(game.time * 60) * 0.3) + ')';
      roundRect(-hw, -hh, hw * 2, hh * 2, 5);
      ctx.fill();
    }
  } else {
    const g = ctx.createLinearGradient(0, -hh, 0, hh);
    g.addColorStop(0, '#c0c6cd');
    g.addColorStop(0.5, '#9aa2ab');
    g.addColorStop(1, '#78808a');
    ctx.fillStyle = g;
    roundRect(-hw, -hh, hw * 2, hh * 2, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(52,60,68,.75)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(70,78,88,.2)';
    for (let i = 0; i < 6; i++) {
      const px = ((i * 37) % Math.max(1, hw * 2)) - hw;
      const py = ((i * 53) % Math.max(1, hh * 2)) - hh;
      ctx.fillRect(px, py, 3, 3);
    }
  }

  // 立体感：左上内高光 + 右下内阴影
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-hw + 4, hh - 4);
  ctx.lineTo(-hw + 4, -hh + 4);
  ctx.lineTo(hw - 4, -hh + 4);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.16)';
  ctx.beginPath();
  ctx.moveTo(hw - 4, -hh + 4);
  ctx.lineTo(hw - 4, hh - 4);
  ctx.lineTo(-hw + 4, hh - 4);
  ctx.stroke();

  // 木头：木节
  if (mat === 'wood' && b.tag.w > 34 && b.tag.h > 20) {
    const kx = (b.tag.w > b.tag.h ? -hw * 0.35 : 0);
    const ky = (b.tag.w > b.tag.h ? 0 : -hh * 0.3);
    ctx.strokeStyle = 'rgba(122,72,26,.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(kx, ky, Math.min(hw, hh) * 0.42, Math.min(hw, hh) * 0.26, 0, 0, 6.2832);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(kx, ky, Math.min(hw, hh) * 0.22, Math.min(hw, hh) * 0.13, 0, 0, 6.2832);
    ctx.stroke();
  }

  // 冰块：棱面折线
  if (mat === 'ice') {
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.7, hh);
    ctx.lineTo(hw * 0.1, -hh * 0.2);
    ctx.lineTo(-hw * 0.2, -hh);
    ctx.stroke();
  }

  const dmg = 1 - b.tag.hp / b.tag.maxHp;
  if (dmg > 0.35 && mat !== 'tnt') {
    ctx.strokeStyle = 'rgba(40,25,10,' + Math.min(0.7, dmg) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.4, -hh);
    ctx.lineTo(-hw * 0.1, -hh * 0.2);
    ctx.lineTo(-hw * 0.45, hh * 0.2);
    ctx.lineTo(-hw * 0.2, hh);
    ctx.moveTo(hw * 0.5, -hh * 0.6);
    ctx.lineTo(hw * 0.2, 0);
    ctx.lineTo(hw * 0.55, hh * 0.6);
    ctx.stroke();
  }

  if (b.tag.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (b.tag.hitFlash * 2) + ')';
    roundRect(-hw, -hh, hw * 2, hh * 2, 4);
    ctx.fill();
  }
  ctx.restore();
}

function drawGhostTrail() {
  for (const p of game.ghostTrail) {
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2, 0, 6.2832);
    ctx.fill();
  }
}

function drawBirdQueue() {
  for (let i = 0; i < game.birdQueue.length; i++) {
    const type = game.birdQueue[i];
    const fake = {
      pos: { x: 92 + i * 46, y: GY - 18 },
      angle: 0, shape: { r: type === 'black' ? 16 : 15 }, tag: { type }
    };
    drawBird(fake);
  }
}

function drawParticlesAndPopups() {
  for (const p of game.particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  }
  for (const pp of game.popups) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, pp.life / pp.maxLife);
    ctx.font = '900 26px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(20,30,45,.55)';
    ctx.strokeText(pp.text, pp.x, pp.y);
    ctx.fillStyle = pp.color;
    ctx.fillText(pp.text, pp.x, pp.y);
    ctx.restore();
  }
}

/* ---------------- 渲染主函数 ---------------- */
function render() {
  drawSky(game.time);
  drawHills();

  ctx.save();
  if (game.shake > 0.2) {
    ctx.translate(rand(-game.shake, game.shake) * 0.6, rand(-game.shake, game.shake) * 0.6);
  }

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  drawGround();
  drawGhostTrail();
  drawSlingshot(true);

  for (const b of bodies) if (b.kind === 'block' || b.kind === 'tnt') drawBlock(b);
  for (const b of bodies) if (b.kind === 'pig') drawPig(b);
  for (const b of bodies) if (b.kind === 'bird') drawBird(b);

  drawSlingshot(false);
  drawBirdQueue();
  drawParticlesAndPopups();

  ctx.restore();
  ctx.restore();
}

/* ---------------- 结算 ---------------- */
function starsFor(levelIdx, score) {
  const th = LEVELS[levelIdx].stars;
  if (score >= th[2]) return 3;
  if (score >= th[1]) return 2;
  return 1;
}

function win() {
  if (game.state === 'won') return;
  const bonus = game.birdQueue.length * 10000;
  game.birdQueue.length = 0;
  if (bonus > 0) addScore(bonus, ANCHOR.x, ANCHOR.y - 40);
  game.state = 'won';
  SFX.win();

  const st = starsFor(game.levelIndex, game.score);
  const prev = progress[game.levelIndex] || 0;
  if (st > prev) progress[game.levelIndex] = st;
  saveProgress();

  const isLast = game.levelIndex >= LEVELS.length - 1;
  resTitle.textContent = isLast ? '全部通关！' : '关卡完成！';
  const starEls = resStars.children;
  for (let i = 0; i < 3; i++) starEls[i].classList.toggle('on', i < st);
  resScore.textContent = game.score;
  resSub.textContent = '剩余小鸟奖励 +' + bonus;
  resMain.textContent = isLast ? '回到第 1 关' : '下一关';
  resMain.dataset.action = isLast ? 'restart-all' : 'next';
  resultOverlay.classList.add('show');
}

function lose() {
  if (game.state === 'lost') return;
  game.state = 'lost';
  SFX.lose();
  const starEls = resStars.children;
  for (let i = 0; i < 3; i++) starEls[i].classList.remove('on');
  resTitle.textContent = '小鸟用完了';
  resScore.textContent = game.score;
  resSub.textContent = '猪还在笑，再来一次吧';
  resMain.textContent = '重玩本关';
  resMain.dataset.action = 'retry';
  resultOverlay.classList.add('show');
}

/* ---------------- 关卡选择 ---------------- */
function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const stars = progress[i] || 0;
    const unlocked = i === 0 || (progress[i - 1] || 0) > 0 || stars > 0;
    const btn = document.createElement('button');
    btn.className = 'lv' + (unlocked ? '' : ' locked');
    const starStr = [0, 1, 2].map(k => (k < stars ? '<span class="lit">★</span>' : '★')).join('');
    btn.innerHTML = '<div class="n">' + (unlocked ? (i + 1) : '🔒') + '</div><div class="s">' + (unlocked ? starStr : '未解锁') + '</div>';
    if (unlocked) {
      btn.addEventListener('click', () => {
        game.score = 0;
        scoreEl.textContent = '0';
        buildLevel(i);
        levelOverlay.classList.remove('show');
      });
    }
    grid.appendChild(btn);
  });
}

/* ---------------- 主循环 ---------------- */
let lastTS = 0, acc = 0;

function frame(ts) {
  if (!lastTS) lastTS = ts;
  const dtReal = Math.min(0.05, (ts - lastTS) / 1000);
  lastTS = ts;
  game.time += dtReal;

  acc += dtReal;
  let steps = 0;
  while (acc >= DT && steps < 6) {
    physicsStep(DT);
    acc -= DT;
    steps++;
  }
  if (steps === 6) acc = 0;
  cleanupBodies();
  updateGameState(dtReal);
  updateCamera(dtReal);

  for (const p of game.particles) {
    p.vy += 900 * dtReal;
    p.x += p.vx * dtReal;
    p.y += p.vy * dtReal;
    p.rot += p.vr * dtReal;
    p.life -= dtReal;
  }
  game.particles = game.particles.filter(p => p.life > 0);
  for (const p of game.popups) { p.y -= 42 * dtReal; p.life -= dtReal; }
  game.popups = game.popups.filter(p => p.life > 0);

  render();
  requestAnimationFrame(frame);
}

/* ---------------- UI 绑定 ---------------- */
document.getElementById('restartBtn').addEventListener('click', () => {
  game.score = 0;
  scoreEl.textContent = '0';
  buildLevel(game.levelIndex);
});

document.getElementById('levelsBtn').addEventListener('click', () => {
  buildLevelGrid();
  levelOverlay.classList.add('show');
});

document.getElementById('closeLevels').addEventListener('click', () => {
  levelOverlay.classList.remove('show');
});

resMain.addEventListener('click', () => {
  const act = resMain.dataset.action;
  resultOverlay.classList.remove('show');
  game.score = 0;
  scoreEl.textContent = '0';
  if (act === 'next') buildLevel(Math.min(LEVELS.length - 1, game.levelIndex + 1));
  else if (act === 'restart-all') buildLevel(0);
  else buildLevel(game.levelIndex);
});

document.getElementById('resRetry').addEventListener('click', () => {
  resultOverlay.classList.remove('show');
  game.score = 0;
  scoreEl.textContent = '0';
  buildLevel(game.levelIndex);
});

document.getElementById('resLevels').addEventListener('click', () => {
  resultOverlay.classList.remove('show');
  buildLevelGrid();
  levelOverlay.classList.add('show');
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    game.score = 0;
    scoreEl.textContent = '0';
    buildLevel(game.levelIndex);
  }
  if (e.key === ' ' && game.state === 'fly' && game.activeBird) {
    const bird = game.activeBird;
    if (bird.tag.type === 'yellow' && !bird.tag.boosted) {
      bird.tag.boosted = true;
      const sp = len(bird.vel);
      bird.vel = mul(norm(bird.vel), Math.min(2100, sp * 1.85 + 220));
    } else if (bird.tag.type === 'black' && !bird.tag.boosted) {
      bird.tag.boosted = true;
      bird.tag.fused = 0.0001;
    }
  }
});

/* ---------------- 启动 ---------------- */
buildLevel(0);
requestAnimationFrame(frame);
</script>
